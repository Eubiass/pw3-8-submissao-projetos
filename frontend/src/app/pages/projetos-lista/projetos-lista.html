<div class="container">

  <h1>Projetos cadastrados</h1>

  <div class="lista-projetos">

    @for (projeto of projetos; track projeto.id) {

      <div class="card-projeto">

        <h2>{{ projeto.titulo }}</h2>

        <p>
          <strong>Área de conhecimento:</strong>
          {{ projeto.areaConhecimento }}
        </p>

        <p>
          <strong>Status:</strong>
          {{ projeto.status }}
        </p>

        <p>
          <strong>Média final:</strong>
          {{ projeto.mediaFinal ?? 'Ainda não avaliado' }}
        </p>

        <button (click)="excluirProjeto(projeto.id!)">
          Excluir
        </button>

      </div>

    } @empty {

      <p>Nenhum projeto cadastrado.</p>

    }

  </div>

</div>
